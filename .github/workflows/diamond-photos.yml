name: Cache diamond thumbnails
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 29 * * * *
permissions:
  contents: write
concurrency:
  group: diamond-photo-cache
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        filter: blob:none
        sparse-checkout: .github
    - name: Install thumbnail tools
      run: python3 -m pip install requests Pillow
    - name: Refresh bounded photo cache
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        KPS_API_USER: ${{ secrets.KPS_API_USER }}
      run: python3 .github/diamond_photos.py
