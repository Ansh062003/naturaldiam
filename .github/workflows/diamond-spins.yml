name: Cache diamond360 frames
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 43 * * * *
permissions:
  contents: write
concurrency:
  group: diamond-spin-cache
  cancel-in-progress: false
jobs:
  spin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        filter: blob:none
        sparse-checkout: .github
    - run: python3 -m pip install requests Pillow cryptography
    - env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        KPS_API_USER: ${{ secrets.KPS_API_USER }}
      run: python3 .github/diamond_spins.py
