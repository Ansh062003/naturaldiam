name: Cache diamond thumbnails
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 29 * * * *
permissions:
  contents: read
concurrency:
  group: diamond-photo-cache
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Install thumbnail tools
      run: python3 -m pip install requests Pillow
    - name: Refresh bounded photo cache
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        KPS_API_USER: ${{ secrets.KPS_API_USER }}
      run: "python3 - <<'PY'\nimport os,io,json,csv,re,hashlib,time,concurrent.futures,requests\nfrom urllib.parse import\
        \ urlparse,unquote\nfrom PIL import Image,ImageOps\nref='eigdjzygkqyslwpcaotp';control='https://api.supabase.com/v1/projects/'+ref\n\
        admin=requests.Session();admin.headers['Authorization']='Bearer '+os.environ['SUPABASE_ACCESS_TOKEN']\ndef api(path,method='POST',**kw):\n\
        \ r=admin.request(method,control+path,timeout=90,**kw);r.raise_for_status();return r.json() if r.content else None\n\
        def sql(q):return api('/database/query',json={'query':q})\n# Never print supplier URLs, credentials or response bodies.\n\
        keys=api('/api-keys','GET');key=next(x['api_key'] for x in keys if x['name']=='service_role')\nbase='https://'+ref+'.supabase.co';headers={'apikey':key,'Authorization':'Bearer\
        \ '+key}\ndef store(path,method='GET',**kw):\n r=requests.request(method,base+'/storage/v1/'+path,headers={**headers,**kw.pop('headers',{})},timeout=40,**kw);r.raise_for_status();return\
        \ r.json() if r.content and 'json' in r.headers.get('content-type','') else None\nusage=sql(\"select coalesce(sum((metadata->>'size')::bigint),0)\
        \ as bytes from storage.objects\")\nprint('Current project storage bytes:',usage[0]['bytes'],flush=True)\nif int(usage[0]['bytes'])>700*1024*1024:raise\
        \ RuntimeError('Insufficient free storage headroom')\nsql('''create table if not exists public.diamond_photo_cache\
        \ (ref text primary key,photo text not null,fingerprint text not null,updated_at timestamptz not null default now());\n\
        alter table public.diamond_photo_cache enable row level security;\nrevoke all on public.diamond_photo_cache from anon,authenticated;\n\
        grant select(ref,photo) on public.diamond_photo_cache to anon,authenticated;\ngrant all on public.diamond_photo_cache\
        \ to service_role;\ndrop policy if exists \"Fresh stock photos only\" on public.diamond_photo_cache;\ncreate policy\
        \ \"Fresh stock photos only\" on public.diamond_photo_cache for select to anon,authenticated using(exists(select 1\
        \ from public.diamond_catalogue_snapshot s,jsonb_array_elements(s.payload) x where s.expires_at>now() and x->>'ref'=diamond_photo_cache.ref));\n\
        notify pgrst,'reload schema';''')\nbuckets=store('bucket')\nif not any(b['id']=='diamond-photos' for b in buckets):store('bucket','POST',json={'id':'diamond-photos','name':'diamond-photos','public':True,'file_size_limit':65536,'allowed_mime_types':['image/webp']})\n\
        # Fixed authenticated source, never an arbitrary-URL proxy.\nreceipt=requests.get('https://kps.diamonds:8443/estock/apistock',params={'user':os.environ['KPS_API_USER']},timeout=60).json()\n\
        u=urlparse(receipt.get('fileUrl',''))\nif receipt.get('status')!='ok' or u.scheme!='https' or u.hostname!='kps.diamonds':raise\
        \ RuntimeError('Invalid stock receipt')\nr=requests.get(u.geturl(),timeout=90);r.raise_for_status();rows=list(csv.DictReader(io.StringIO(r.content.decode('utf-8-sig'))))\n\
        snap=sql('select payload,expires_at>now() as fresh from public.diamond_catalogue_snapshot where id=1')[0]\nif not\
        \ snap['fresh']:raise RuntimeError('Stock snapshot expired')\nlive={s['ref']:s for s in snap['payload']};source={r['STOCKID'].strip():r\
        \ for r in rows if r['STATUS'].strip()=='PROMOTION'}\n# Never delete based on a failed, empty or suspiciously different\
        \ export.\nif len(set(live)&set(source))<.95*len(live):raise RuntimeError('Source/snapshot mismatch')\nold={r['ref']:r\
        \ for r in sql('select * from public.diamond_photo_cache')}\nsold=[x for x in old if x not in source or x not in live]\n\
        for start in range(0,len(sold),100):\n batch=sold[start:start+100];store('object/diamond-photos','DELETE',json={'prefixes':[x+'.webp'\
        \ for x in batch]})\n sql('delete from public.diamond_photo_cache where ref in ('+','.join(\"'\"+x.replace(\"'\",\"\
        ''\")+\"'\" for x in batch)+')')\nprint('Removed sold assets:',len(sold),flush=True)\ndef candidate(st):\n row=source.get(st['ref']);formula=row.get('IMAGES/VIDEO','')\
        \ if row else '';match=re.search(r'HYPERLINK\\(\"([^\\\"]+)\"',formula)\n if not match:return None\n gallery=match[1];u=urlparse(gallery)\n\
        \ if u.scheme!='https' or u.hostname!='kps.diamonds' or u.path!='/estock/faces/ImageExpStockList.jsp':return None\n\
        \ fingerprint=hashlib.sha256(gallery.encode()).hexdigest()\n return (st['ref'],gallery,fingerprint) if st['ref'] not\
        \ in old or old[st['ref']]['fingerprint']!=fingerprint else None\npending=[c for c in (candidate(s) for s in sorted(live.values(),key=lambda\
        \ x:-x['discount'])) if c]\n# Bounded run: 500 lookups, two concurrent connections, originals <=8MB, thumbnails <=64KB.\n\
        fail=0;done=0;deadline=time.monotonic()+900\ncache_bytes=sum(int(x.get('bytes',0)) for x in [])\ncache_usage=sql(\"\
        select coalesce(sum((metadata->>'size')::bigint),0) as bytes from storage.objects where bucket_id='diamond-photos'\"\
        )[0]['bytes']\nlimit=min(500,max(0,(256*1024*1024-int(cache_usage))//65536));work=pending[:limit]\ndef photo(item):\n\
        \ if time.monotonic()>deadline:return None\n stock,gallery,fingerprint=item\n if not re.fullmatch(r'[A-Za-z0-9_-]{1,60}',stock):return\
        \ None\n try:\n  g=requests.get(gallery,timeout=20,allow_redirects=False);g.raise_for_status()\n  if len(g.content)>1024*1024:return\
        \ None\n  links=re.findall(r'href=[\\\"\\x27]([^\\\"\\x27]+)',g.text)\n  image=next((x for x in links if 'Officelight\
        \ Gray-01.png' in unquote(x)),None)\n  if not image:return None\n  u=urlparse(image)\n  if u.scheme!='https' or u.hostname!='images.kpsanghvi.com'\
        \ or not u.path.startswith('/estock/CertifiedItemImages/'):return None\n  rr=requests.get(image,timeout=25,stream=True,allow_redirects=False);rr.raise_for_status();data=bytearray()\n\
        \  for chunk in rr.iter_content(65536):\n   data.extend(chunk)\n   if len(data)>8*1024*1024:return None\n  Image.MAX_IMAGE_PIXELS=16*1024*1024\n\
        \  im=ImageOps.exif_transpose(Image.open(io.BytesIO(data)));im.thumbnail((600,600));im=im.convert('RGB');out=io.BytesIO();im.save(out,'WEBP',quality=85)\n\
        \  if out.tell()>65536:out=io.BytesIO();im.save(out,'WEBP',quality=65)\n  if out.tell()>65536:return None\n  store('object/diamond-photos/'+stock+'.webp','POST',data=out.getvalue(),headers={'Content-Type':'image/webp','x-upsert':'true','cache-control':'3600'})\n\
        \  url=base+'/storage/v1/object/public/diamond-photos/'+stock+'.webp'\n  # Ref binds exact source gallery. URLs never\
        \ reach public output.\n  q=\"insert into public.diamond_photo_cache(ref,photo,fingerprint) values('%s','%s','%s')\
        \ on conflict(ref) do update set photo=excluded.photo,fingerprint=excluded.fingerprint,updated_at=now()\"%(stock,url,fingerprint)\n\
        \  sql(q);return True\n except Exception:return None\nwith concurrent.futures.ThreadPoolExecutor(max_workers=2) as\
        \ pool:\n for success in pool.map(photo,work):\n  if success:done+=1\n  else:fail+=1\nprint('Photo batch:',json.dumps({'attempted':len(work),'cached':done,'fallback':fail,'pending_before':len(pending)}),flush=True)\n\
        print('Cache totals:',json.dumps(sql('select count(*) as photos from public.diamond_photo_cache')),flush=True)\n\n\
        PY"
